name: Import FPS Monitor Panel upstream

on:
  push:
    branches:
      - refactor/reference-monitor-integration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-fps-monitor-panel
  cancel-in-progress: false

jobs:
  import-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: refactor/reference-monitor-integration
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import complete upstream repository as a subtree
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e upstream/fps-monitor-panel ]]; then
            echo "Target upstream/fps-monitor-panel already exists; refusing to overwrite."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add fps-monitor-panel https://github.com/rawalakshay/fps-monitor-panel.git
          git fetch --no-tags fps-monitor-panel main
          UPSTREAM_SHA="$(git rev-parse fps-monitor-panel/main)"
          echo "Pinned upstream commit: ${UPSTREAM_SHA}"

          git subtree add --prefix=upstream/fps-monitor-panel fps-monitor-panel main --squash

          mkdir -p upstream
          printf '%s\n' "${UPSTREAM_SHA}" > upstream/FPS_MONITOR_PANEL_UPSTREAM_COMMIT
          git add upstream/FPS_MONITOR_PANEL_UPSTREAM_COMMIT
          git commit -m "vendor: pin FPS Monitor Panel upstream snapshot"

          git push origin HEAD:refactor/reference-monitor-integration
