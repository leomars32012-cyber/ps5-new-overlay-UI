name: Build and Release FPS Monitor

on:
  push:
    branches:
      - main
      - master
      - refactor/reference-monitor-integration
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
      - refactor/reference-monitor-integration
  workflow_dispatch:
    inputs:
      create_release:
        description: Publish a GitHub Release after a successful build
        required: true
        type: boolean
        default: false
      release_version:
        description: Release tag/version (for example v1.1.0)
        required: false
        default: v1.1.0

permissions:
  contents: read

jobs:
  build:
    name: Test and build upstream-based PS5 payload
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git wget unzip cmake ninja-build make \
            clang-18 lld-18 llvm-18 llvm-18-dev python3
          sudo ln -sf /usr/bin/llvm-config-18 /usr/bin/llvm-config
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-18 /usr/bin/ld.lld

      - name: Run upstream host tests
        run: bash upstream/fps-monitor-panel/scripts/test.sh

      - name: Install PS5 Payload SDK
        run: |
          wget -q https://github.com/ps5-payload-dev/sdk/releases/download/v0.43/ps5-payload-sdk.zip -O /tmp/ps5-payload-sdk.zip
          sudo unzip -q /tmp/ps5-payload-sdk.zip -d /opt
          sudo chmod -R 755 /opt/ps5-payload-sdk
          test -x /opt/ps5-payload-sdk/bin/prospero-cmake
          test -x /opt/ps5-payload-sdk/bin/prospero-clang
          test -f /opt/ps5-payload-sdk/target/lib/libc++.a

      - name: Build FPS Monitor payload
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
          LLVM_CONFIG: /usr/bin/llvm-config-18
        run: |
          export PATH="/opt/ps5-payload-sdk/bin:/usr/lib/llvm-18/bin:${PATH}"
          prospero-cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPS5_PAYLOAD_SDK="${PS5_PAYLOAD_SDK}"
          cmake --build build --target fps_monitor --verbose -j"$(nproc)"

      - name: Compile optional HUD diagnostics variant
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
          LLVM_CONFIG: /usr/bin/llvm-config-18
        run: |
          export PATH="/opt/ps5-payload-sdk/bin:/usr/lib/llvm-18/bin:${PATH}"
          prospero-cmake -S . -B build-perf -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPS5_PAYLOAD_SDK="${PS5_PAYLOAD_SDK}" \
            -DPS5_OVERLAY_PERF_DIAGNOSTICS=ON
          cmake --build build-perf --target fps_monitor --verbose -j"$(nproc)"

      - name: Prepare build artifacts
        run: |
          mkdir -p dist
          cp build/bin/fps-monitor.elf dist/fps-monitor.elf
          cp build-perf/bin/fps-monitor.elf dist/fps-monitor-perf.elf
          cp upstream/fps-monitor-panel/config.ini.example dist/config.ini.example
          cd dist
          sha256sum fps-monitor.elf fps-monitor-perf.elf > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fps-monitor-ps5-build
          path: |
            dist/fps-monitor.elf
            dist/fps-monitor-perf.elf
            dist/SHA256SUMS.txt
            dist/config.ini.example
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: fps-monitor-ps5-build
          path: dist

      - name: Determine release tag
        id: vars
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="${{ inputs.release_version }}"
          fi
          echo "tag=${TAG_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: FPS Monitor + PS5 Telemetry ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |
            ## FPS Monitor Panel — upstream-based PS5 overlay

            This build uses rawalakshay/fps-monitor-panel as its overlay, ShellUI,
            renderer, FPS/frame-time pipeline, settings and payload foundation.

            This fork adds telemetry that the foundation did not expose:
            - VRAM page-table usage, reported independently from system RAM.
            - Fan duty percentage via the optional libkernel_sys symbol.

            Existing upstream CPU per-core sampling, temperatures, GPU rail power,
            FPS statistics, frame-time history and rendering are retained.

            Hardware readings depend on available PS5 firmware symbols and APIs.
            Validate telemetry on-console before treating readings as authoritative.
            The build has not been certified on every firmware version.

            Licensed under GPL-3.0; upstream copyright notices are preserved.
          files: |
            dist/fps-monitor.elf
            dist/SHA256SUMS.txt
            dist/config.ini.example
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
