name: Verify FPS Monitor Foundation

on:
  push:
    branches:
      - refactor/reference-monitor-integration
  pull_request:
    branches:
      - refactor/reference-monitor-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host layout and web-config tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Run upstream host tests
        run: bash upstream/fps-monitor-panel/scripts/test.sh

  ps5-build:
    name: Build upstream-based PS5 payload
    runs-on: ubuntu-24.04
    needs: host-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git wget unzip cmake ninja-build make \
            clang-18 lld-18 llvm-18 llvm-18-dev python3
          sudo ln -sf /usr/bin/llvm-config-18 /usr/bin/llvm-config
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-18 /usr/bin/ld.lld

      - name: Install PS5 Payload SDK
        run: |
          wget -q https://github.com/ps5-payload-dev/sdk/releases/download/v0.43/ps5-payload-sdk.zip -O /tmp/ps5-payload-sdk.zip
          sudo unzip -q /tmp/ps5-payload-sdk.zip -d /opt
          sudo chmod -R 755 /opt/ps5-payload-sdk
          test -x /opt/ps5-payload-sdk/bin/prospero-cmake
          test -x /opt/ps5-payload-sdk/bin/prospero-clang
          test -f /opt/ps5-payload-sdk/target/lib/libc++.a

      - name: Build FPS Monitor payload from upstream foundation
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
          LLVM_CONFIG: /usr/bin/llvm-config-18
        run: |
          export PATH="/opt/ps5-payload-sdk/bin:/usr/lib/llvm-18/bin:${PATH}"
          bash upstream/fps-monitor-panel/scripts/build.sh --release --jobs "$(nproc)"

      - name: Upload PS5 ELF
        uses: actions/upload-artifact@v4
        with:
          name: fps-monitor-ps5-elf
          path: upstream/fps-monitor-panel/build/bin/fps-monitor.elf
          if-no-files-found: error
